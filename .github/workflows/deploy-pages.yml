name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download image assets for GitHub Pages
        run: |
          mkdir -p public/site-assets
          for pointer in src/assets/*.asset.json; do
            url=$(jq -r '.url' "$pointer")
            filename=$(basename "$url")
            curl --fail --silent --show-error --location \
              "https://project--ed46e4c9-cdb3-4042-b1ed-712cf83fe566-dev.lovable.app${url}" \
              --output "public/site-assets/${filename}"
          done

      - name: Build static site
        run: bun run build

      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4